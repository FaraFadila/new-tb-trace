name: tb_trace
description: "TB Trace Flutter Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Basics
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.4
  flutter_screenutil: ^5.9.3
  shimmer: ^3.0.0
  lottie: ^3.3.3
  gap: ^3.0.1
  iconsax: ^0.0.8

  # State & Nav
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3

  # Networking
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  
  # Backend & Data
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2

  # Maps (Menggunakan FlutterMap saja agar stabil)
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/start_illustration.png
    - assets/images/tbc1.png
    - assets/maps/kelurahan_surabaya.geojson